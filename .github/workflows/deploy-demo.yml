name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build smooth-ui-demo --baseHref=/smooth-ui/
      # Pages has no server: unknown routes fall back to the client-side app.
      - run: cp dist/apps/smooth-ui-demo/browser/index.csr.html dist/apps/smooth-ui-demo/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/smooth-ui-demo/browser
      - id: deployment
        uses: actions/deploy-pages@v4
